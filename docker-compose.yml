version: "3.9"

# docker-compose.yml — SST app + Lovable Cloud DB + Caddy (reverse proxy)
# Uso en Digital Ocean (Ubuntu):
#   1) Instala Docker y Portainer.
#   2) Sube este repo a GitHub con su Dockerfile y Caddyfile.
#   3) Despliega como Stack en Portainer inyectando las variables de entorno (.env).

services:
  # ────────────────────────────────────────────────────────────────
  # Aplicación (TanStack Start, conectada a Lovable Cloud DB)
  # ────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}
    container_name: sst-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3000}
      # Variables de Lovable Cloud / Supabase
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}
    expose:
      - "${APP_PORT:-3000}"
    networks:
      - sst-net

  # ────────────────────────────────────────────────────────────────
  # Caddy — reverse proxy con HTTPS automático (Let's Encrypt)
  # ────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: sst-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
      APP_PORT: ${APP_PORT:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - sst-net

volumes:
  caddy_data:
  caddy_config:

networks:
  sst-net:
    driver: bridge
